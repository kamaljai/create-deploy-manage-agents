[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "__AGENT_SLUG__"
version = "0.1.0"
description = "Dockerized agent generated from a reusable skill"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.11.5",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.10",
]

[project.scripts]
skill-agent = "skill_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

